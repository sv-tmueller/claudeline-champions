name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, lint, unit tests and asset checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # ubuntu-latest ships python3. The Blender tests skip without Blender.
      - run: npm run assets:validate
      - run: npm run assets:test

  # The bots' heap check (packages/bots/test/allocation.test.ts) on the Node majors the unit job does
  # not run, through vitest.heap.config.ts: Node 26 (V8 14.6) in the default tiers and in Maglev
  # alone, the tier a browser match runs the bots in, and Node 24 in the default tiers (its limits sit
  # within 10 percent of the clean figures, so every Node major the engines field allows runs the
  # check). Node 22 runs it in `checks`. Node 26 is pinned to the version the Maglev limits were
  # measured on: a bump means measuring again (docs/architecture/bots.md, Allocation).
  bots-heap:
    name: Bots heap check, Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 26.7.0
            projects: ''
          - node: 24
            projects: '--project bots-heap'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The verbose reporter prints the figures of the passing runs, which the limits are read from.
      - run: npx vitest run --config vitest.heap.config.ts --reporter verbose ${{ matrix.projects }}

  # Build and e2e skip draft pull requests. A draft shows green without them.
  build:
    name: Production build
    needs: checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: Playwright smoke test
    needs: checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
