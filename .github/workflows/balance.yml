name: Balance reproduction

# A manual run only: it plays the bot matches of docs/design/balance.md and checks that the block
# reproduces on linux/amd64. Two jobs run side by side, one per mode (--mode 2v2 and --mode 3v3),
# each comparing that mode's cell rows and budget-hit lines with the committed block: the whole run
# is 14 minutes on Apple silicon at six kits (2v2 5.3, 3v3 8.9) and 2.9 to 3.1 times that on a runner,
# so one job per mode keeps each inside its timeout. A job that fails plays its mode again in a
# second step to print the differing rows, so each timeout-minutes is twice that job's check time
# plus a margin (2v2 45, 3v3 75; the seeds are never lowered to fit, see balance.md section 7). Trigger
# it on a branch with
#   gh workflow run balance.yml --ref <branch>
# It never runs on pull requests or pushes. A newer run on the same ref cancels the older one.
on:
  workflow_dispatch:

concurrency:
  group: balance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproduce:
    name: npm run balance -- --check --mode ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: 2v2
            timeout: 45
          - mode: 3v3
            timeout: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run balance -- --check --mode ${{ matrix.mode }}
      # On a difference: play the mode again into a scratch file and diff its rows (the cell rows
      # and the budget-hit lines of that mode) against the committed block, so a mismatch shows
      # the cells. The head line and the other mode's rows are not in either side.
      - name: Show the differing cells
        if: failure()
        env:
          MODE: ${{ matrix.mode }}
        run: |
          npm run balance -- --mode "$MODE" --out "$RUNNER_TEMP/fresh.md"
          rows() { grep -E "^\| $MODE \||^- .+ v .+, $MODE, [^,]+, with " "$1" || true; }
          sed -n '/<!-- balance:report -->/,/<!-- \/balance:report -->/p' docs/design/balance.md > "$RUNNER_TEMP/committed.md"
          rows "$RUNNER_TEMP/committed.md" > "$RUNNER_TEMP/committed.rows"
          rows "$RUNNER_TEMP/fresh.md" > "$RUNNER_TEMP/fresh.rows"
          diff -u "$RUNNER_TEMP/committed.rows" "$RUNNER_TEMP/fresh.rows"
