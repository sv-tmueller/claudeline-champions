name: Balance reproduction

# A manual run only: it plays the bot matches of docs/design/balance.md and checks that the block
# reproduces on linux/amd64. Two jobs run side by side, one per mode (--mode 2v2 and --mode 3v3),
# each comparing that mode's cell rows and budget-hit lines with the committed block. The whole run
# is about 47 minutes of matches on Apple silicon at nine kits with the orb, an estimate by match
# count and not a measurement: the six-kit three-arena 2v2 8.0 and 3v3 13.4 minutes (from about 52
# and 92 ms a match, over 9000 and 8640 matches) scaled by the nine-kit counts, 21 168 in 2v2 (28
# seeds a config) and 18 144 in 3v3 (4 seeds), give 2v2 18.8 and 3v3 28.1. A runner takes 2.9 to 3.1
# times that: 2v2 55 to 58 and 3v3 82 to 87 minutes. One job per mode keeps each inside its timeout.
# A job that fails plays its mode again in a second step to print the differing rows, so each
# timeout-minutes is twice that job's check time at 3.1 (2v2 117, 3v3 175) plus a margin of at least
# 25 percent, then rounded up to the next multiple of 10 minutes (2v2 150, 3v3 220; both under the
# 6 hours GitHub allows a job). The seeds are never lowered to fit, see balance.md section 7.
# Trigger it on a branch with
#   gh workflow run balance.yml --ref <branch>
# It never runs on pull requests or pushes. A newer run on the same ref cancels the older one.
on:
  workflow_dispatch:

concurrency:
  group: balance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproduce:
    name: npm run balance -- --check --mode ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: 2v2
            timeout: 150
          - mode: 3v3
            timeout: 220
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run balance -- --check --mode ${{ matrix.mode }}
      # On a difference: play the mode again into a scratch file and diff its rows (the cell rows
      # and the budget-hit lines of that mode) against the committed block, so a mismatch shows
      # the cells. The head line and the other mode's rows are not in either side.
      - name: Show the differing cells
        if: failure()
        env:
          MODE: ${{ matrix.mode }}
        run: |
          npm run balance -- --mode "$MODE" --out "$RUNNER_TEMP/fresh.md"
          rows() { grep -E "^\| $MODE \||^- .+ v .+, $MODE, [^,]+, with " "$1" || true; }
          sed -n '/<!-- balance:report -->/,/<!-- \/balance:report -->/p' docs/design/balance.md > "$RUNNER_TEMP/committed.md"
          rows "$RUNNER_TEMP/committed.md" > "$RUNNER_TEMP/committed.rows"
          rows "$RUNNER_TEMP/fresh.md" > "$RUNNER_TEMP/fresh.rows"
          diff -u "$RUNNER_TEMP/committed.rows" "$RUNNER_TEMP/fresh.rows"
